<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    document.documentElement.classList.add("js");
    /* Boot language guard: if a non-English language is preferred, hide the body
       until the translated dictionary has been applied (failsafe timeout in i18n.js). */
    (function () {
      var L = null;
      try { L = new URLSearchParams(location.search).get("lang") || localStorage.getItem("foldfx-lang"); } catch (e) {}
      if (!L) {
        var c = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
        var codes = ["zh", "hi", "es", "fr", "ar", "bn", "pt", "ru", "ur", "id", "de", "ja", "mr", "te", "el"];
        for (var i = 0; i < c.length; i++) {
          var b = String(c[i]).toLowerCase().split("-")[0];
          if (codes.indexOf(b) > -1) { L = b; break; }
        }
      }
      if (L && L !== "en") document.documentElement.classList.add("fx-boot");
    })();
  </script>
  <title data-i18n="meta.nf.title">404 — Page not found | FoldFX</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050506">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="notfound">
    <img src="assets/foldfx-icon.png" alt="" width="88" height="88" class="nf-icon">
    <h1 class="grad-text">404</h1>
    <p data-i18n="nf.p">Looks like this page folded away.</p>
    <a class="btn btn-primary" href="index.html" data-i18n="nf.cta">Back to FoldFX</a>
  </main>

  <script src="js/i18n/languages.js"></script>
  <script src="js/i18n/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/consent.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
